---
services:
  tailwind-builder:
    image: orinoco/tailwind-builder
    profiles: ["tools"]
    build:
      context: ./railsapp
      target: tailwind-builder
      network: ${ORINOCO_BUILD_NETWORK:-default}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["mkdir -p /output && cp /rails/app/assets/builds/tailwind.css /output/tailwind.css.tmp && mv /output/tailwind.css.tmp /output/tailwind.css"]
    volumes:
      - ./railsapp/app/assets/builds:/output
  orinoco-db:
    environment:
    - POSTGRES_DB=${ORINOCO_DB_POSTGRES_DB}
    - POSTGRES_PASSWORD=${ORINOCO_DB_POSTGRES_PASSWORD}
    - POSTGRES_USER=${ORINOCO_DB_POSTGRES_USER}
    ports:
    - "${ORINOCO_DB_POSTGRES_PORT}:5432"
  railsapp:
    environment:
    - DATABASE_URL=${ORINOCO_DB_DATABASE_URL}
    - RAILS_ENV=development
    - RAILS_MAX_THREADS=5
    - RAILS_MIN_THREADS=5
    - SCOREBOARD_REDIS_URL=${SCOREBOARD_REDIS_URL}
    - EVENT_PIPELINE_GOAWS_URL=${EVENT_PIPELINE_GOAWS_URL}
    ports:
    - "${ORINOCO_WEB_PORT}:3000"
    depends_on:
      orinoco-db:
        condition: service_healthy
        restart: true
    volumes:
      - ./railsapp:/rails
      - bundle:/usr/local/bundle

  goaws:
    ports:
    - "${GOAWS_WEB_PORT}:4100"
  obs-bridge-worker:
    network_mode: host
    environment:
      - DATABASE_URL=postgres://${ORINOCO_DB_POSTGRES_USER}:${ORINOCO_DB_POSTGRES_PASSWORD}@localhost:${ORINOCO_DB_POSTGRES_PORT}/${ORINOCO_DB_POSTGRES_DB}
      - RAILS_ENV=development
      - RAILS_MAX_THREADS=5
      - RAILS_MIN_THREADS=5
      - SCOREBOARD_REDIS_URL=redis://localhost:${SCOREBOARD_REDIS_PORT}/0
      - EVENT_PIPELINE_GOAWS_URL=http://localhost:${GOAWS_WEB_PORT}
      - OBS_HOST=localhost
      - OBS_BRIDGE_DEFAULT_ENABLED=true
      - OBS_WEBSOCKET_CONFIG_PATH=/run/secrets/obs-websocket.json
    depends_on:
      orinoco-db:
        condition: service_healthy
        restart: true
    volumes:
      - ./railsapp:/rails
      - bundle:/usr/local/bundle
      - ${OBS_WEBSOCKET_CONFIG:-/dev/null}:/run/secrets/obs-websocket.json:ro
  twitch-bridge-worker:
    environment:
      - DATABASE_URL=${ORINOCO_DB_DATABASE_URL}
      - RAILS_ENV=development
      - RAILS_MAX_THREADS=5
      - RAILS_MIN_THREADS=5
      - SCOREBOARD_REDIS_URL=${SCOREBOARD_REDIS_URL}
      - EVENT_PIPELINE_GOAWS_URL=${EVENT_PIPELINE_GOAWS_URL}
    depends_on:
      orinoco-db:
        condition: service_healthy
        restart: true
    volumes:
      - ./railsapp:/rails
      - bundle:/usr/local/bundle
  seven-tv-bridge-worker:
